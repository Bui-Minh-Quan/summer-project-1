services:
  vllm:
    image: vllm/vllm-openai:v0.10.1
    container_name: vllm
    restart: unless-stopped
    runtime: nvidia
    ipc: host

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "8008:8000"

    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}

    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct-GPTQ-Int4
      --served-model-name qwen-1.5b
      --dtype auto
      --max-model-len 8192
      --gpu-memory-utilization 0.90
      --enforce-eager
      --guided-decoding-backend xgrammar
      --enable-chunked-prefill
      --max-num-seqs 8

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5m
    
    networks:
      - financial-ai-network  

networks:
  financial-ai-network:    
    external: true