[tool.pytest.ini_options]
pythonpath = [
  ".",
  "app/api",
  "modules/acquisition",
  "modules/extraction",
  "modules/graph",
  "modules/mlops",
  "modules/reasoning"
]
testpaths = [
  "app/api/tests",
  "modules/acquisition/tests",
  "modules/extraction/tests",
  "modules/graph/tests",
  "modules/mlops/tests",
  "modules/reasoning/tests"
]
asyncio_mode = "auto"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Depends", "fastapi.Body", "fastapi.Header", "fastapi.File"]