name: Module 4 CI (MLOps Pipeline)

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'feature/*' ]
    paths:
      - 'modules/mlops/**'
      - '.github/workflows/mlops_ci.yml'
      - 'requirements.txt'

  pull_request:
    branches: [ main, develop ]
    paths:
      - 'modules/mlops/**'
      - '.github/workflows/mlops_ci.yml'
      - 'requirements.txt'

jobs:
  validate-and-test:
    name: Lint, Type Check & Test (MLOps Module)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Ruff Code Linter
        run: |
          ruff check modules/mlops/

      - name: Run Mypy Static Type Checking
        run: |
          mypy modules/mlops/ --ignore-missing-imports --explicit-package-bases

      - name: Run Unit & Integration Tests with Pytest
        run: |
          cd modules/mlops
          pytest tests/ -v