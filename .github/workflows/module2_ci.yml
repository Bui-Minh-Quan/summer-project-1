name: Module 2 CI (Knowledge Graph Extraction)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'modules/extraction/**'
      - '.github/workflows/module2_ci.yml'
      - 'requirements.txt'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'modules/extraction/**'
      - '.github/workflows/module2_ci.yml'
      - 'requirements.txt'

jobs:
  ci-extraction:
    name: Lint, Type Check & Test (Module 2)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pydantic confluent-kafka redis pymongo
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Ruff Linter
        run: |
          ruff check modules/extraction

      - name: Run Mypy Type Checking
        run: |
          mypy modules/extraction --ignore-missing-imports --explicit-package-bases

      - name: Run Pytest Test Suite
        run: |
          cd modules/extraction
          pytest tests/ -v