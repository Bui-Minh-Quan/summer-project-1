name: Module 3 CI (Graph Building Engine)

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'modules/graph/**'
      - '.github/workflows/module3_ci.yml'
      - 'requirements.txt'

  pull_request:
    branches: [ main, develop ]
    paths:
      - 'modules/graph/**'
      - '.github/workflows/module3_ci.yml'
      - 'requirements.txt'

jobs:
  validate-and-test:
    name: Lint, Type Check & Test (Module 3)
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/secretpassword
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pydantic pydantic-settings neo4j confluent-kafka pymongo
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Ruff Code Linter
        run: |
          ruff check modules/graph/

      - name: Run Mypy Static Type Checking
        run: |
          mypy modules/graph/ --ignore-missing-imports --explicit-package-bases

      - name: Run Unit & Integration Tests with Pytest
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASS: secretpassword
        run: |
          cd modules/graph
          pytest tests/ -v